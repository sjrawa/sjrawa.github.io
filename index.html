<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7fb">
  <meta name="robots" content="noindex, nofollow">
  <meta name="application-name" content="sjrawa Abitur">
  <meta name="apple-mobile-web-app-title" content="sjrawa Abitur">
  <title>sjrawa Abitur</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/abi-192.png">
  <link rel="apple-touch-icon" href="icons/abi-192.png">
  <!-- Lock page of the published copy, generated by scripts/publish-site.cjs (design: scripts/site-lock.cjs). -->
  <style>
    :root{color-scheme:light;--ink:#172335;--muted:#556478;--line:#e1e6f0;--bg:#f5f7fb;--brand:#384fc6;--brand-dark:#253ba5;--bad:#b42318;font-family:"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px 16px;background:var(--bg);color:var(--ink)}
    main{width:100%;max-width:380px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:28px 24px;box-shadow:0 2px 5px #15274705,0 8px 18px #15274706}
    .mark{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--brand);color:#fff;font-weight:700;font-size:20px}
    h1{font-size:22px;margin:16px 0 4px}
    p{margin:0;line-height:1.6}
    .lead{color:var(--muted);margin-bottom:20px}
    label{display:block;font-weight:600;margin-bottom:6px}
    #password{width:100%;min-height:48px;font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
    #password:focus{outline:2px solid var(--brand);outline-offset:1px;border-color:var(--brand)}
    button{width:100%;min-height:48px;margin-top:12px;font:inherit;font-weight:600;color:#fff;background:var(--brand);border:0;border-radius:10px;cursor:pointer}
    button:hover{background:var(--brand-dark)}
    button:disabled{opacity:.6;cursor:progress}
    #status{min-height:1.6em;margin-top:12px;color:var(--muted)}
    #status.bad{color:var(--bad)}
    .note{margin-top:18px;padding-top:16px;border-top:1px solid var(--line);color:var(--muted);font-size:14px}
    .account{position:absolute;left:-10000px;width:1px;height:1px;overflow:hidden}
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">A</div>
    <h1>sjrawa Abitur</h1>
    <p class="lead">NRW Abitur 2027 · 请输入密码</p>
    <form id="unlock">
      <input class="account" type="text" name="username" autocomplete="username" value="sjrawa" tabindex="-1" aria-hidden="true">
      <label for="password">密码</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button id="enter" type="submit">打开网站</button>
      <p id="status" role="status" aria-live="polite"></p>
    </form>
    <p class="note">每台设备只需输入一次，之后会自动记住。想退出时，点网页最下面的「锁定这台设备」。</p>
  </main>
  <script>
  (() => {
    'use strict';
    const LOCK = {"keyId":"5bceab2b96b21068","kdf":"PBKDF2-SHA256","iterations":600000,"salt":"1FAX+hL/BZJcakgBqciiJw==","iv":"ePnwfc/io7Y91qCK","wrapped":"gqzbip7JYbwt3beE+EgYjUIWq0oMpDYJ3wlMOF6hYtZymQ7n/MZQmDUUTP+9sROZ"};
    const form = document.getElementById('unlock');
    const field = document.getElementById('password');
    const button = document.getElementById('enter');
    const status = document.getElementById('status');
    const BROWSER = '请用最新版 Safari、Chrome 或 Edge 打开，不要用无痕 / 隐私模式。';
    const say = (text, bad = false) => { status.textContent = text; status.className = bad ? 'bad' : ''; };
    const supported = window.isSecureContext && 'serviceWorker' in navigator && window.crypto && crypto.subtle
      && 'indexedDB' in window && 'DecompressionStream' in window && 'caches' in window;
    if (!supported) { form.hidden = true; say('这个浏览器打不开加密的网站。' + BROWSER, true); return; }

    const bytes = text => Uint8Array.from(atob(text), character => character.charCodeAt(0));
    function database(mode, work) {
      return new Promise((resolve, reject) => {
        const opening = indexedDB.open('sjrawa-abitur-lock', 1);
        opening.onupgradeneeded = () => opening.result.createObjectStore('keys');
        opening.onerror = () => reject(opening.error);
        opening.onsuccess = () => {
          const db = opening.result;
          const transaction = db.transaction('keys', mode);
          const request = work(transaction.objectStore('keys'));
          transaction.oncomplete = () => { db.close(); resolve(request && request.result); };
          transaction.onerror = transaction.onabort = () => { db.close(); reject(transaction.error); };
        };
      });
    }
    async function remember(raw) {
      const entry = {keyId: LOCK.keyId, savedAt: new Date().toISOString()};
      const key = await crypto.subtle.importKey('raw', raw, {name: 'AES-GCM'}, false, ['decrypt']);
      // Keep a non-extractable key; browsers that cannot store keys in IndexedDB get the raw bytes instead.
      try { await database('readwrite', store => store.put({...entry, key}, 'content')); }
      catch { await database('readwrite', store => store.put({...entry, raw: new Uint8Array(raw)}, 'content')); }
    }
    function ping(worker) {
      return new Promise(resolve => {
        const channel = new MessageChannel();
        const timer = setTimeout(() => resolve(null), 1000);
        channel.port1.onmessage = event => { clearTimeout(timer); resolve(event.data && event.data.keyId || null); };
        worker.postMessage({type: 'sjrawa-lock-ping'}, [channel.port2]);
      });
    }
    async function workerReady() {
      const registration = await navigator.serviceWorker.register('/abi-sw.js', {scope: '/', updateViaCache: 'none'});
      try { await registration.update(); } catch { /* the worker that is already installed may be current */ }
      for (let attempt = 0; attempt < 60; attempt++) {
        const current = await navigator.serviceWorker.getRegistration('/');
        if (current && current.active && await ping(current.active) === LOCK.keyId) return;
        await new Promise(resolve => setTimeout(resolve, 250));
      }
      throw new Error('worker');
    }
    async function openSite() {
      let tries = 0;
      try { tries = Number(sessionStorage.getItem('sjrawa-lock-open') || 0); sessionStorage.setItem('sjrawa-lock-open', String(tries + 1)); } catch { /* no session storage */ }
      if (tries >= 2) { try { sessionStorage.removeItem('sjrawa-lock-open'); } catch { /* ignore */ } throw new Error('loop'); }
      await workerReady();
      location.reload();
    }
    function failed(error) {
      button.disabled = false;
      const reason = error && error.message;
      if (reason === 'loop') say('密码已经记住，但网站没有打开。请把这个页面（或主屏幕上的应用）完全关掉，再重新打开。', true);
      else if (reason === 'worker') say('网站的离线组件没有启动。' + BROWSER, true);
      else say('打开失败：' + (reason || error), true);
    }
    form.addEventListener('submit', async event => {
      event.preventDefault();
      button.disabled = true;
      say('正在验证密码…');
      try {
        const material = await crypto.subtle.importKey('raw', new TextEncoder().encode(field.value.normalize('NFC')), 'PBKDF2', false, ['deriveKey']);
        const wrappingKey = await crypto.subtle.deriveKey({name: 'PBKDF2', hash: 'SHA-256', salt: bytes(LOCK.salt), iterations: LOCK.iterations},
          material, {name: 'AES-GCM', length: 256}, false, ['decrypt']);
        let raw;
        try {
          raw = await crypto.subtle.decrypt({name: 'AES-GCM', iv: bytes(LOCK.iv), additionalData: new TextEncoder().encode('sjrawa-abitur-lock:' + LOCK.keyId)}, wrappingKey, bytes(LOCK.wrapped));
        } catch {
          button.disabled = false;
          say('密码不对，请再试一次。', true);
          field.select();
          return;
        }
        await remember(raw);
        field.value = '';
        say('密码正确，正在打开…');
        await openSite();
      } catch (error) { failed(error); }
    });
    // Without the current key, no decrypted offline copy may stay on the device (locked, or password changed).
    const forgetCopy = () => caches.delete('sjrawa-abitur-offline-assets-v1').catch(() => {});
    database('readonly', store => store.get('content')).then(saved => {
      if (saved && saved.keyId === LOCK.keyId) { button.disabled = true; say('这台设备已记住密码，正在打开…'); openSite().catch(failed); return; }
      forgetCopy();
      if (saved) say('网站密码已经更换，请输入新密码。');
    }).catch(forgetCopy);
  })();
  </script>
</body>
</html>
